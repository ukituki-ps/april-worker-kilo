# Базовый стек для dev/stage: документация (статика + Structurizr Lite + Swagger UI) за Nginx.
# Образы приложений (backend/frontend) подключаются позже через profiles и images.env — см. docs/DEPLOYMENT_STRATEGY.md

services:
  nginx-docs:
    image: nginx:1.27-alpine
    profiles: ["aprilhub", "docs"]
    ports:
      - "${DOCS_HTTP_PORT:-8080}:80"
    volumes:
      - ./docs-site/build:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./openapi:/usr/share/nginx/openapi:ro
    depends_on:
      - swagger-ui
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /swagger
      URL: /openapi/openapi.yaml
    volumes:
      - ./openapi:/usr/share/nginx/html/openapi:ro
    expose:
      - "8080"
    restart: unless-stopped

  structurizr-lite:
    image: structurizr/lite:2024.03.03
    ports:
      - "${STRUCTURIZR_HTTP_PORT:-8091}:8080"
    volumes:
      # Lite создаёт/обновляет workspace.json при работе — том не только для чтения
      - ./structurizr:/usr/local/structurizr
    restart: unless-stopped

  hub-bff:
    image: ${HUB_BFF_IMAGE:-golang:1.24-alpine}
    profiles: ["aprilhub"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace/hub-bff
    command: sh -c "go mod download && go run ./cmd/hub-bff"
    environment:
      HUB_BFF_PORT: ${HUB_BFF_PORT:-8081}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080/auth}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-april}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://127.0.0.1/auth/realms/april}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-aprilhub-shell}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/auth/realms/april/protocol/openid-connect/certs}
    volumes:
      - ./:/workspace
    expose:
      - "${HUB_BFF_PORT:-8081}"
    depends_on:
      - keycloak
    restart: unless-stopped

  hub-shell:
    image: ${HUB_SHELL_IMAGE:-node:20-alpine}
    profiles: ["aprilhub"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace/hub-shell
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port ${HUB_SHELL_PORT:-4173}"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-/auth}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-april}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-aprilhub-shell}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./:/workspace
    expose:
      - "4173"
    depends_on:
      - hub-bff
    restart: unless-stopped

  april-showcase:
    image: ${APRIL_SHOWCASE_IMAGE:-node:20-alpine}
    profiles: ["aprilhub"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace/design-system/DisignApril
    command: sh -c "corepack enable && CI=true pnpm install --frozen-lockfile && pnpm --filter @april/showcase exec vite --host 0.0.0.0 --port ${APRIL_SHOWCASE_PORT:-4174}"
    volumes:
      - ./:/workspace
    expose:
      - "${APRIL_SHOWCASE_PORT:-4174}"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    profiles: ["aprilhub"]
    command: start-dev --import-realm --http-relative-path /auth
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KC_HOSTNAME:-https://dev.april.ukituki.tech/auth}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS:-false}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes/aprilhub:/opt/keycloak/themes/aprilhub:ro
    expose:
      - "8080"
    depends_on:
      - keycloak-db
    restart: unless-stopped

  keycloak-db:
    image: postgres:17-alpine
    profiles: ["aprilhub"]
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    profiles: ["aprilhub"]
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --requirepass ${REDIS_PASSWORD:-redis-dev-change-me}
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  keycloak_pgdata:
  redis_data:
