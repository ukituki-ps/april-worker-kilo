# Unified ingress AprilHub:
# - /         -> hub-shell
# - /api/     -> hub-bff
# - /auth/    -> keycloak
# - /docs/    -> Docusaurus
# - /openapi/ -> OpenAPI YAML
# - /swagger/ -> Swagger UI

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off;
    set $forwarded_proto $scheme;
    set $forwarded_port $server_port;
    if ($http_x_forwarded_proto != "") {
        set $forwarded_proto $http_x_forwarded_proto;
    }
    if ($http_x_forwarded_port != "") {
        set $forwarded_port $http_x_forwarded_port;
    }

    # Hub Shell (Vite dev server). HMR/websocket headers are required in dev profile.
    location / {
        set $hub_shell_upstream hub-shell:4173;
        proxy_pass http://$hub_shell_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Public health/readiness checks without direct hub-bff port usage.
    location = /healthz {
        set $hub_bff_upstream hub-bff:8081;
        proxy_pass http://$hub_bff_upstream/healthz;
    }

    location = /readyz {
        set $hub_bff_upstream hub-bff:8081;
        proxy_pass http://$hub_bff_upstream/readyz;
    }

    location /api/ {
        set $hub_bff_upstream hub-bff:8081;
        proxy_pass http://$hub_bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /auth/ {
        set $keycloak_upstream keycloak:8080;
        proxy_pass http://$keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    # Optional docs access under /docs/.
    location /docs/ {
        rewrite ^/docs/?(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /openapi/ {
        alias /usr/share/nginx/openapi/;
        default_type application/yaml;
        add_header Cache-Control "public, max-age=300";
    }

    location /swagger/ {
        set $swagger_ui_upstream swagger-ui:8080;
        proxy_pass http://$swagger_ui_upstream/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
