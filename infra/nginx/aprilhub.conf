# AprilHub production Nginx — слушает :8080
# Без HMR/WebSocket (vite dev server удалён, preview не требует upgrade).
# На serverDev привязан к 8080, на сервере пр01 — TLS terminator, passthrough /.

server {
    listen 80 default_server;
    server_name dev.april.ukituki.tech localhost;

    # ============================================================
    # Security headers — глобальные для всех зон
    # ============================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Keycloak (/auth/ prefix) — proxy_pass сохраняет /auth для Keycloak контекста
    location /auth {
        # Deny framing for Keycloak pages
        add_header X-Frame-Options "DENY" always;
        # Repeat global headers (nginx doesn't inherit add_header to nested location)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # Hub BFF API — full path forwarding (BFF routes are /api/v1/...)
    location /api/ {
        # API responses should not be framed
        add_header X-Frame-Options "DENY" always;
        # CSP for API endpoints: block all content loading (API returns JSON only)
        add_header Content-Security-Policy "default-src 'none'" always;
        # Repeat global headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        proxy_pass http://hub-bff:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /metrics endpoint — Prometheus — доступ только из внутренней сети
    location = /metrics {
        allow 172.21.0.0/16;
        allow 127.0.0.1/32;
        allow ::1/128;
        deny all;

        proxy_pass http://hub-bff:8081/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health endpoints — no security headers needed for health checks
    location = /healthz {
        proxy_pass http://hub-bff:8081/healthz;
        proxy_set_header Host $host;
    }
    location = /livez {
        proxy_pass http://hub-bff:8081/livez;
        proxy_set_header Host $host;
    }
    location = /readyz {
        proxy_pass http://hub-bff:8081/readyz;
        proxy_set_header Host $host;
    }

    # Hub Shell (frontend) — fallback
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        # CSP for Hub Shell — whitelist self + Keycloak + Sentry
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://dev.april.ukituki.tech https://sentry.io; frame-src 'self' https://dev.april.ukituki.tech/auth; report-uri /api/v1/csp-report" always;
        # Repeat global headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        proxy_http_version 1.1;
        proxy_pass http://hub-shell:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
