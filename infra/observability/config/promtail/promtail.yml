server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push}

scrape_configs:
  - job_name: docker_local
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: "/(.*)"
        replacement: "$1"
      - source_labels: [container]
        target_label: service
      - target_label: job
        replacement: docker
      - target_label: host
        replacement: ${HOST_ALIAS:-unknown-host}
      - source_labels: [__meta_docker_container_id]
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - labels:
          stream:
          service:
          container:
      - output:
          source: log
