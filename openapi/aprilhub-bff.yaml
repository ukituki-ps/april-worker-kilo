openapi: 3.1.0
info:
  title: AprilHub BFF API
  version: 0.1.0
  description: MVP контракт для bootstrap AprilHub.
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:8081
    description: Local dev
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHubHealthz
      tags: [System]
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /readyz:
    get:
      summary: Readiness probe
      operationId: getHubReadyz
      tags: [System]
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/overview:
    get:
      summary: Aggregated dashboard overview
      operationId: getHubOverview
      tags: [Overview]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Aggregated payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token issued by Keycloak OIDC flow.
        Refresh and login flows are handled by Keycloak, not by Hub BFF.
  schemas:
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ReadinessResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ready
        timestamp:
          type: string
          format: date-time
    OverviewResponse:
      type: object
      required: [status, widgets]
      properties:
        status:
          type: string
          example: degraded
        widgets:
          type: array
          items:
            type: object
            required: [id, state]
            properties:
              id:
                type: string
              state:
                type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
