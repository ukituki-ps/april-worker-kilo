openapi: 3.1.0
info:
  title: AprilHub BFF API
  version: 1.0.0
  description: |
    Baseline v1 контракт Hub BFF для UI-агрегации AprilHub.
    Non-breaking изменения вносятся внутри `/api/v1/*`, breaking изменения требуют новой версии API.
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:8081
    description: Local dev
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHubHealthz
      tags: [System]
      security: []
       responses:
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitResponse"
          headers:
            Retry-After:
              schema:
                type: integer
  /api/v1/aggregation/dashboard:
    get:
      summary: Aggregated dashboard data for hub shell
      operationId: getHubAggregationDashboard
      tags: [Aggregation]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Aggregated dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregationResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/aggregation/home:
    get:
      summary: Aggregated home data for hub shell
      operationId: getHubAggregationHome
      tags: [Aggregation]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Aggregated home payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregationResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitResponse"
          headers:
            Retry-After:
              schema:
                type: integer
  /api/v1/aggregation/summary:
    get:
      summary: Aggregated summary data for hub shell
      operationId: getHubAggregationSummary
      tags: [Aggregation]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Aggregated summary payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregationResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitResponse"
          headers:
            Retry-After:
              schema:
                type: integer
  /api/v1/me:
    get:
      summary: Current user profile
      operationId: getCurrentUserProfile
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile from JWT claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserProfile"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitResponse"
          headers:
            Retry-After:
              schema:
                type: integer
  /api/v1/admin/ping:
    get:
      summary: Admin-only auth guard probe
      operationId: getAdminPing
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin role has access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitResponse"
          headers:
            Retry-After:
              schema:
                type: integer
  /api/v1/admin/profile/{proxyPath}:
    parameters:
      - name: proxyPath
        in: path
        required: true
        schema:
          type: string
        description: Path that is proxied to AprilProfile upstream.
    get:
      summary: Admin proxy to AprilProfile (GET)
      operationId: adminProfileProxyGet
      tags: [AdminProxy]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Response from AprilProfile upstream
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitResponse"
          headers:
            Retry-After:
              schema:
                type: integer
        "502":
          description: Upstream unavailable
    post:
      summary: Admin proxy to AprilProfile (POST)
      operationId: adminProfileProxyPost
      tags: [AdminProxy]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Response from AprilProfile upstream
        "201":
          description: Resource created by AprilProfile upstream
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream unavailable
    put:
      summary: Admin proxy to AprilProfile (PUT)
      operationId: adminProfileProxyPut
      tags: [AdminProxy]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Response from AprilProfile upstream
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream unavailable
    patch:
      summary: Admin proxy to AprilProfile (PATCH)
      operationId: adminProfileProxyPatch
      tags: [AdminProxy]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Response from AprilProfile upstream
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream unavailable
    delete:
      summary: Admin proxy to AprilProfile (DELETE)
      operationId: adminProfileProxyDelete
      tags: [AdminProxy]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Response from AprilProfile upstream
        "204":
          description: Resource deleted by AprilProfile upstream
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token issued by Keycloak OIDC flow.
        Refresh and login flows are handled by Keycloak, not by Hub BFF.
   schemas:
    RateLimitResponse:
      type: object
      description: Возвращается при превышении лимита запросов (rate limiting)
      required: [code, message, metadata]
      properties:
        code:
          type: string
          example: rate_limit_exceeded
        message:
          type: string
          example: слишком много запросов, попробуйте позже
        metadata:
          type: object
          properties:
            retryAfter:
              type: integer
              description: секунд до сброса окна rate limit
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ReadinessResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ready
        timestamp:
          type: string
          format: date-time
    OverviewResponse:
      type: object
      required: [status, widgets]
      properties:
        status:
          type: string
          example: degraded
        widgets:
          type: array
          items:
            type: object
            required: [id, state]
            properties:
              id:
                type: string
              state:
                type: string
    AggregationResponse:
      type: object
      required: [status, data, metadata]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: degraded
        data:
          type: object
          additionalProperties: true
        degraded:
          type: array
          items:
            $ref: "#/components/schemas/DegradedSource"
        metadata:
          $ref: "#/components/schemas/Metadata"
    CurrentUserProfile:
      type: object
      required: [sub, username, email, name, roles]
      properties:
        sub:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            type: string
    Error:
      type: object
      required: [code, message, metadata]
      properties:
        code:
          type: string
        message:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
    DegradedSource:
      type: object
      required: [sourceService, code, message]
      properties:
        sourceService:
          type: string
        code:
          type: string
          example: downstream_unavailable
        message:
          type: string
    Metadata:
      type: object
      required: [correlationId, requestId, sourceService]
      properties:
        correlationId:
          type: string
        requestId:
          type: string
        sourceService:
          type: string
        timestamp:
          type: string
          format: date-time
          description: Optional timestamp when available in upstream context.
