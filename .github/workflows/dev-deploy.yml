# Автодеплой на dev: merge PR в develop → push → этот workflow на self-hosted runner.
# См. docs/DEPLOYMENT_STRATEGY.md

name: Deploy to dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Sync repo and run deploy.sh
    runs-on: [self-hosted, dev, profile]
    timeout-minutes: 60
    env:
      # Must be a git clone of *this* repo (ukituki-ps/april-worker): github.sha is taken from this workflow's event.
      # Default /opt/april-worker matches deploy.sh; override with repo variable APRIL_DEPLOY_ROOT if the clone lives elsewhere.
      APRIL_DEPLOY_ROOT: ${{ vars.APRIL_DEPLOY_ROOT != '' && vars.APRIL_DEPLOY_ROOT || '/opt/april-worker' }}
      # Если на стенде VITE_ALLOWED_HOSTS без localhost — задайте в GitHub Vars (напр. имя из allowedHosts).
      DEPLOY_INGRESS_HTTP_HOST: ${{ vars.APRIL_INGRESS_HTTP_HOST }}
      APRIL_PROFILE_SUBMODULE_URL: git@github.com:ukituki-ps/april-profile.git
      DISIGNAPRIL_SUBMODULE_URL: git@github.com:ukituki-ps/DisignApril.git
    steps:
      - name: Checkout ref and deploy
        env:
          APRIL_PROFILE_DEPLOY_KEY: ${{ secrets.APRIL_PROFILE_DEPLOY_KEY }}
          DISIGNAPRIL_DEPLOY_KEY: ${{ secrets.DISIGNAPRIL_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          ROOT="${APRIL_DEPLOY_ROOT}"
          echo "Deploy root: ${ROOT}"
          echo "Commit: ${{ github.sha }}"
          test -d "${ROOT}/.git"
          cd "${ROOT}"
          test -x ./deploy.sh
          test -n "${APRIL_PROFILE_DEPLOY_KEY}"
          test -n "${DISIGNAPRIL_DEPLOY_KEY}"
          APRIL_PROFILE_KEY_FILE="$(mktemp)"
          DISIGNAPRIL_KEY_FILE="$(mktemp)"
          trap 'rm -f "${APRIL_PROFILE_KEY_FILE}" "${DISIGNAPRIL_KEY_FILE}"; if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi' EXIT
          printf '%s\n' "${APRIL_PROFILE_DEPLOY_KEY}" > "${APRIL_PROFILE_KEY_FILE}"
          printf '%s\n' "${DISIGNAPRIL_DEPLOY_KEY}" > "${DISIGNAPRIL_KEY_FILE}"
          chmod 600 "${APRIL_PROFILE_KEY_FILE}" "${DISIGNAPRIL_KEY_FILE}"
          eval "$(ssh-agent -s)"
          ssh-add "${APRIL_PROFILE_KEY_FILE}"
          ssh-add "${DISIGNAPRIL_KEY_FILE}"
          DEPLOY_KEY_SSH="ssh -o StrictHostKeyChecking=accept-new"
          # git checkout тянет новые gitlink субмодулей; URL из .gitmodules — HTTPS без токена → "could not read Username".
          # Для субмодулей нужен APRIL_PROFILE_DEPLOY_KEY, но тот же GIT_SSH_COMMAND ломает `git fetch origin`,
          # если origin — SSH на этот репозиторий: deploy-key только для april-profile → "Repository not found".
          git config submodule.vendor/april-profile.url "${APRIL_PROFILE_SUBMODULE_URL}"
          git config submodule.design-system/DisignApril.url "${DISIGNAPRIL_SUBMODULE_URL}"
          git reset --hard
          git clean -fd
          unset GIT_SSH_COMMAND || true
          git fetch origin
          export GIT_SSH_COMMAND="${DEPLOY_KEY_SSH}"
          git checkout "${{ github.sha }}"
          SKIP_GIT_PULL=1 DEPLOY_ARTIFACTS_DIR="${ROOT}/.deploy-artifacts" ./deploy.sh

      - name: Upload deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-deploy-artifacts-${{ github.run_id }}
          path: |
            ${{ env.APRIL_DEPLOY_ROOT }}/.deploy-artifacts/**
          if-no-files-found: warn
          include-hidden-files: true
