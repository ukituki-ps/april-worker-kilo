# Автодеплой на dev: merge PR в develop → push → этот workflow на self-hosted runner.
# См. docs/DEPLOYMENT_STRATEGY.md

name: Deploy to dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Sync repo and run deploy.sh
    runs-on: [self-hosted, dev, profile]
    timeout-minutes: 60
    env:
      # Must be a git clone of *this* repo (ukituki-ps/april-worker): github.sha is taken from this workflow's event.
      # Default /opt/april-worker matches deploy.sh; override with repo variable APRIL_DEPLOY_ROOT if the clone lives elsewhere.
      APRIL_DEPLOY_ROOT: ${{ vars.APRIL_DEPLOY_ROOT != '' && vars.APRIL_DEPLOY_ROOT || '/opt/april-worker' }}
      APRIL_PROFILE_SUBMODULE_URL: git@github.com:ukituki-ps/april-profile.git
      DISIGNAPRIL_SUBMODULE_URL: git@github.com:ukituki-ps/DisignApril.git
    steps:
      - name: Checkout ref and deploy
        env:
          APRIL_PROFILE_DEPLOY_KEY: ${{ secrets.APRIL_PROFILE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          ROOT="${APRIL_DEPLOY_ROOT}"
          echo "Deploy root: ${ROOT}"
          echo "Commit: ${{ github.sha }}"
          test -d "${ROOT}/.git"
          cd "${ROOT}"
          test -x ./deploy.sh
          test -n "${APRIL_PROFILE_DEPLOY_KEY}"
          KEY_FILE="$(mktemp)"
          trap 'rm -f "${KEY_FILE}"' EXIT
          printf '%s\n' "${APRIL_PROFILE_DEPLOY_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          # git checkout тянет новые gitlink субмодулей; URL из .gitmodules — HTTPS без токена → "could not read Username".
          # Совпадает с deploy.sh / scripts/ci-init-git-submodules.sh: для fetch нужен SSH + APRIL_PROFILE_DEPLOY_KEY.
          git config submodule.vendor/april-profile.url "${APRIL_PROFILE_SUBMODULE_URL}"
          git config submodule.design-system/DisignApril.url "${DISIGNAPRIL_SUBMODULE_URL}"
          # Self-hosted deploy root may contain local drift from previous runs.
          git reset --hard
          git clean -fd
          git fetch origin
          git checkout "${{ github.sha }}"
          SKIP_GIT_PULL=1 DEPLOY_ARTIFACTS_DIR="${ROOT}/.deploy-artifacts" ./deploy.sh

      - name: Upload deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-deploy-artifacts-${{ github.run_id }}
          path: |
            ${{ env.APRIL_DEPLOY_ROOT }}/.deploy-artifacts/**
          if-no-files-found: warn
          include-hidden-files: true
