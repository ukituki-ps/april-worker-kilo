# Одноразовая / редкая публикация @april/tokens и @april/ui в GitHub Packages из submodule DisignApril.
# Нужна для первого появления пакетов в registry и для обновления hub-shell/package-lock.json (npm ci).
name: Publish @april DS to GitHub Packages

on:
  workflow_dispatch:

# Typical GPR publish: packages:write (+ contents:read). contents:write avoids rare link/metadata failures.
permissions:
  contents: write
  packages: write

concurrency:
  group: publish-april-ds-gpr
  cancel-in-progress: true

jobs:
  publish:
    # GitHub-hosted runners may be unavailable for private org billing; use the same pool as CI.
    runs-on: [self-hosted, ci, profile]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@ukituki-ps"

      - name: Enable Corepack (pnpm in DisignApril)
        run: corepack enable

      - name: Build design system (pnpm workspace)
        working-directory: design-system/DisignApril
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # GitHub Packages requires the npm scope to match the repo owner (@ukituki-ps), not @april.
      # Consumers keep imports via npm aliases: "@april/ui": "npm:@ukituki-ps/april-ui@^…"
      - name: Publish @ukituki-ps/april-tokens (GPR)
        working-directory: design-system/DisignApril/packages/tokens
        env:
          # GPR_PUBLISH_TOKEN: optional classic PAT with write:packages (gh auth token scopes are often insufficient).
          NODE_AUTH_TOKEN: ${{ secrets.GPR_PUBLISH_TOKEN != '' && secrets.GPR_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.name = '@ukituki-ps/april-tokens';
          p.repository = {
            type: 'git',
            url: 'https://github.com/ukituki-ps/april-worker.git',
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm publish --registry=https://npm.pkg.github.com

      - name: Publish @ukituki-ps/april-ui (GPR)
        working-directory: design-system/DisignApril/packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_PUBLISH_TOKEN != '' && secrets.GPR_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.name = '@ukituki-ps/april-ui';
          p.dependencies = p.dependencies || {};
          delete p.dependencies['@april/tokens'];
          p.dependencies['@ukituki-ps/april-tokens'] = '^0.1.0';
          p.repository = {
            type: 'git',
            url: 'https://github.com/ukituki-ps/april-worker.git',
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm publish --registry=https://npm.pkg.github.com
