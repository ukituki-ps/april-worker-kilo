# Публикация @ukituki-ps/april-tokens и @ukituki-ps/april-ui в GitHub Packages (DisignApril submodule).
#
# Секрет GPR_PUBLISH_TOKEN (обязателен):
#   Classic PAT: минимум write:packages + read:packages; для приватного репо — repo.
#   Организация с SSO: после создания PAT → «Configure SSO» / Authorize для ukituki-ps.
#   Запись в репозитории:
#     printf '%s' 'YOUR_PAT' | gh secret set GPR_PUBLISH_TOKEN -R ukituki-ps/april-worker
#
# Почему не GITHUB_TOKEN: у многих org токен Actions не получает write в GPR (write_package), даже при Read and write в репо.
name: Publish @april DS to GitHub Packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-april-ds-gpr
  cancel-in-progress: true

jobs:
  publish:
    runs-on: [self-hosted, ci, profile]
    steps:
      - name: Require GPR_PUBLISH_TOKEN secret
        if: ${{ secrets.GPR_PUBLISH_TOKEN == '' }}
        run: |
          echo "::error title=Missing GPR_PUBLISH_TOKEN::Add repository secret GPR_PUBLISH_TOKEN (classic PAT: write:packages, read:packages). See workflow header in publish-april-ds-gpr.yml"
          exit 1

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@ukituki-ps"

      - name: Enable Corepack (pnpm in DisignApril)
        run: corepack enable

      - name: Build design system (pnpm workspace)
        working-directory: design-system/DisignApril
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Scope владельца репозитория (@ukituki-ps), не @april. Потребители: npm aliases → @april/ui в hub-shell.
      - name: Publish @ukituki-ps/april-tokens (GPR)
        working-directory: design-system/DisignApril/packages/tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_PUBLISH_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.name = '@ukituki-ps/april-tokens';
          p.repository = {
            type: 'git',
            url: 'https://github.com/ukituki-ps/april-worker.git',
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm publish --registry=https://npm.pkg.github.com

      - name: Publish @ukituki-ps/april-ui (GPR)
        working-directory: design-system/DisignApril/packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_PUBLISH_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.name = '@ukituki-ps/april-ui';
          p.dependencies = p.dependencies || {};
          delete p.dependencies['@april/tokens'];
          p.dependencies['@ukituki-ps/april-tokens'] = '^0.1.0';
          p.repository = {
            type: 'git',
            url: 'https://github.com/ukituki-ps/april-worker.git',
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm publish --registry=https://npm.pkg.github.com
