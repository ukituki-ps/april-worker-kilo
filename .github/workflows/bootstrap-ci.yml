# Минимальный CI для bootstrap: валидация инфраструктуры документации и compose.
# Полный пайплайн деплоя на dev — по docs/DEPLOYMENT_STRATEGY.md (merge в develop, runner на сервере).

name: bootstrap-ci

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  docs-and-compose:
    runs-on: [self-hosted, ci, profile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build Docusaurus
        working-directory: docs-site
        run: npm run build

      - name: Lint OpenAPI
        run: make openapi-lint

      - name: Docker Compose config
        run: docker compose config

  hub-modules-smoke:
    runs-on: [self-hosted, ci, profile]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init git submodules (public DisignApril; avoid GITHUB_TOKEN 404)
        run: ./scripts/ci-init-git-submodules.sh

      - name: Enable Corepack (pnpm for design-system build)
        run: corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version-file: hub-bff/go.mod

      - name: Hub BFF tests
        working-directory: hub-bff
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub-shell/package-lock.json

      - name: Hub Shell install + design system + lint + build
        working-directory: hub-shell
        run: npm ci && npm run ds:prepare && npm run lint && npm run build
