name: Testing Extensions Nightly

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  hub-shell-playwright-smoke:
    name: Hub Shell Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub-shell/package-lock.json

      - name: Setup start time
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Prepare Playwright artifacts
        run: mkdir -p artifacts/playwright

      - name: Run Playwright smoke suite
        run: ./scripts/run-playwright-aprilhub.sh

      - name: Copy Playwright report artifacts
        if: always()
        run: |
          mkdir -p artifacts/playwright/report artifacts/playwright/test-results
          cp -R hub-shell/playwright-report/. artifacts/playwright/report/ 2>/dev/null || true
          cp -R hub-shell/test-results/. artifacts/playwright/test-results/ 2>/dev/null || true

      - name: Write quality metrics payload
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, time, pathlib
          started = int(os.environ.get("JOB_STARTED_AT", str(int(time.time()))))
          payload = {
              "job": "hub-shell-playwright-smoke",
              "status": "completed",
              "duration_seconds": max(0, int(time.time()) - started),
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "is_retry": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")) > 1,
          }
          path = pathlib.Path("artifacts/playwright/quality-metrics.json")
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprilhub-playwright-artifacts
          path: artifacts/playwright

  hub-bff-integration:
    name: Hub BFF integration (Testcontainers + Atlas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: hub-bff/go.mod

      - name: Install Atlas CLI
        run: |
          curl -sSf https://atlasgo.sh | sh
          echo "$HOME/.atlas/bin" >> "$GITHUB_PATH"

      - name: Setup start time
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run integration suite
        working-directory: hub-bff
        run: go test ./... -run Integration

      - name: Write quality metrics payload
        if: always()
        run: |
          mkdir -p artifacts/integration
          python3 - <<'PY'
          import json, os, time, pathlib
          started = int(os.environ.get("JOB_STARTED_AT", str(int(time.time()))))
          payload = {
              "job": "hub-bff-integration",
              "status": "completed",
              "duration_seconds": max(0, int(time.time()) - started),
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "is_retry": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")) > 1,
          }
          path = pathlib.Path("artifacts/integration/quality-metrics.json")
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprilhub-integration-quality-metrics
          path: artifacts/integration

  aprilhub-k6-extended:
    name: AprilHub k6 extended
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup start time
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Prepare k6 extended artifacts directory
        run: mkdir -p artifacts/k6-extended

      - name: Run AprilHub k6 extended profile
        env:
          K6_SUMMARY_EXPORT: artifacts/k6-extended/summary.json
        run: ./scripts/run-k6-aprilhub-extended.sh | tee artifacts/k6-extended/k6-extended.log

      - name: Write quality metrics payload
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, time, pathlib
          started = int(os.environ.get("JOB_STARTED_AT", str(int(time.time()))))
          payload = {
              "job": "aprilhub-k6-extended",
              "status": "completed",
              "duration_seconds": max(0, int(time.time()) - started),
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "is_retry": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")) > 1,
          }
          path = pathlib.Path("artifacts/k6-extended/quality-metrics.json")
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload k6 extended artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprilhub-k6-extended-artifacts
          path: artifacts/k6-extended
