# Проверки на PR и push: OpenAPI + сборка Docusaurus. Расширяйте при появлении Go/фронтенда приложения.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-compatibility:
    name: OpenAPI compatibility (no breaking changes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest

      - name: Check OpenAPI backward compatibility
        run: |
          export PATH="$HOME/go/bin:$PATH"
          scripts/check-openapi-compat.sh

  quality:
    name: Lint OpenAPI and build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: OpenAPI lint
        run: make openapi-lint

      - name: Docusaurus build
        run: make docs-build

  hub-bff:
    name: Hub BFF tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: hub-bff/go.mod

      - name: Run Hub BFF tests
        working-directory: hub-bff
        run: go test ./...

  hub-shell:
    name: Hub Shell lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub-shell/package-lock.json

      - name: Install Hub Shell dependencies
        working-directory: hub-shell
        run: npm ci

      - name: Hub Shell lint
        working-directory: hub-shell
        run: npm run lint

      - name: Hub Shell build
        working-directory: hub-shell
        run: npm run build

  aprilhub-smoke:
    name: AprilHub runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AprilHub smoke checks
        run: ./scripts/smoke-aprilhub.sh
