# Обязательный quality gate AprilHub (P0): openapi, hub-bff, hub-shell, smoke, k6.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Еженедельный security scan: ПН 06:00 UTC

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOMODCACHE: /var/cache/aprilhub/go/pkg/mod
  GOCACHE: /var/cache/aprilhub/go/build
  npm_config_cache: /var/cache/aprilhub/npm
  APRIL_DOCKER_MIRROR: 127.0.0.1:5000
  APRIL_GCR_MIRROR: 127.0.0.1:5001
  # GitHub Packages (hub-shell .npmrc): не логировать; при недоступности GPR_READ_TOKEN — GITHUB_TOKEN + packages:read
  NODE_AUTH_TOKEN: ${{ secrets.GPR_READ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  openapi-compatibility:
    name: OpenAPI compatibility (no breaking changes)
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 10
    steps:
      - name: Pre-clean workspace (best effort)
        run: |
          WORKDIR="${GITHUB_WORKSPACE:-$PWD}"
          chown -R "$(id -u):$(id -g)" "$WORKDIR" 2>/dev/null || true
          rm -rf "$WORKDIR/.pnpm-store" "$WORKDIR/hub-shell/node_modules" "$WORKDIR/hub-shell/dist" || true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Ensure local cache directories
        run: |
          if mkdir -p "$GOMODCACHE" "$GOCACHE" "$npm_config_cache" 2>/dev/null; then
            echo "Using system cache paths under /var/cache/aprilhub"
          else
            FALLBACK_ROOT="$HOME/.cache/aprilhub"
            mkdir -p "$FALLBACK_ROOT/go/pkg/mod" "$FALLBACK_ROOT/go/build" "$FALLBACK_ROOT/npm"
            {
              echo "GOMODCACHE=$FALLBACK_ROOT/go/pkg/mod"
              echo "GOCACHE=$FALLBACK_ROOT/go/build"
              echo "npm_config_cache=$FALLBACK_ROOT/npm"
            } >> "$GITHUB_ENV"
            echo "System cache not writable; switched to $FALLBACK_ROOT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install oasdiff
        run: go install github.com/tufin/oasdiff@v1.10.29

      - name: Check OpenAPI backward compatibility
        run: |
          export PATH="$HOME/go/bin:$PATH"
          scripts/check-openapi-compat.sh

  quality:
    name: Lint OpenAPI and build docs
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 20
    steps:
      - name: Pre-clean workspace (best effort)
        run: |
          WORKDIR="${GITHUB_WORKSPACE:-$PWD}"
          chown -R "$(id -u):$(id -g)" "$WORKDIR" 2>/dev/null || true
          rm -rf "$WORKDIR/.pnpm-store" "$WORKDIR/hub-shell/node_modules" "$WORKDIR/hub-shell/dist" || true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Ensure local cache directories
        run: |
          if mkdir -p "$GOMODCACHE" "$GOCACHE" "$npm_config_cache" 2>/dev/null; then
            echo "Using system cache paths under /var/cache/aprilhub"
          else
            FALLBACK_ROOT="$HOME/.cache/aprilhub"
            mkdir -p "$FALLBACK_ROOT/go/pkg/mod" "$FALLBACK_ROOT/go/build" "$FALLBACK_ROOT/npm"
            {
              echo "GOMODCACHE=$FALLBACK_ROOT/go/pkg/mod"
              echo "GOCACHE=$FALLBACK_ROOT/go/build"
              echo "npm_config_cache=$FALLBACK_ROOT/npm"
            } >> "$GITHUB_ENV"
            echo "System cache not writable; switched to $FALLBACK_ROOT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: OpenAPI lint
        run: make openapi-lint

      - name: Docusaurus build
        run: make docs-build

  hub-bff:
    name: Hub BFF tests
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 10
    steps:
      - name: Pre-clean workspace (best effort)
        run: |
          WORKDIR="${GITHUB_WORKSPACE:-$PWD}"
          chown -R "$(id -u):$(id -g)" "$WORKDIR" 2>/dev/null || true
          rm -rf "$WORKDIR/.pnpm-store" "$WORKDIR/hub-shell/node_modules" "$WORKDIR/hub-shell/dist" || true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Ensure local cache directories
        run: |
          if mkdir -p "$GOMODCACHE" "$GOCACHE" "$npm_config_cache" 2>/dev/null; then
            echo "Using system cache paths under /var/cache/aprilhub"
          else
            FALLBACK_ROOT="$HOME/.cache/aprilhub"
            mkdir -p "$FALLBACK_ROOT/go/pkg/mod" "$FALLBACK_ROOT/go/build" "$FALLBACK_ROOT/npm"
            {
              echo "GOMODCACHE=$FALLBACK_ROOT/go/pkg/mod"
              echo "GOCACHE=$FALLBACK_ROOT/go/build"
              echo "npm_config_cache=$FALLBACK_ROOT/npm"
            } >> "$GITHUB_ENV"
            echo "System cache not writable; switched to $FALLBACK_ROOT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: hub-bff/go.mod
          cache-dependency-path: hub-bff/go.sum
          cache: false

      - name: Run Hub BFF tests
        working-directory: hub-bff
        run: go test ./...

  hub-shell:
    name: Hub Shell lint, test and build
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 10
    steps:
      - name: Pre-clean workspace (best effort)
        run: |
          WORKDIR="${GITHUB_WORKSPACE:-$PWD}"
          chown -R "$(id -u):$(id -g)" "$WORKDIR" 2>/dev/null || true
          rm -rf "$WORKDIR/.pnpm-store" "$WORKDIR/hub-shell/node_modules" "$WORKDIR/hub-shell/dist" || true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: true

      - name: Ensure local cache directories
        run: |
          if mkdir -p "$GOMODCACHE" "$GOCACHE" "$npm_config_cache" 2>/dev/null; then
            echo "Using system cache paths under /var/cache/aprilhub"
          else
            FALLBACK_ROOT="$HOME/.cache/aprilhub"
            mkdir -p "$FALLBACK_ROOT/go/pkg/mod" "$FALLBACK_ROOT/go/build" "$FALLBACK_ROOT/npm"
            {
              echo "GOMODCACHE=$FALLBACK_ROOT/go/pkg/mod"
              echo "GOCACHE=$FALLBACK_ROOT/go/build"
              echo "npm_config_cache=$FALLBACK_ROOT/npm"
            } >> "$GITHUB_ENV"
            echo "System cache not writable; switched to $FALLBACK_ROOT"
          fi

      - name: Init git submodules (DisignApril + april-profile)
        run: ./scripts/ci-init-git-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub-shell/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@ukituki-ps"

      - name: Install Hub Shell dependencies
        working-directory: hub-shell
        run: npm ci

      - name: Build design system (DisignApril → @april/ui)
        working-directory: hub-shell
        run: npm run ds:prepare

      - name: Hub Shell lint
        working-directory: hub-shell
        run: npm run lint

      - name: Hub Shell unit tests
        working-directory: hub-shell
        run: npm run test

      - name: Hub Shell build
        working-directory: hub-shell
        run: npm run build

  hub-shell-alpine-runtime:
    name: Hub Shell alpine runtime preflight
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 15
    steps:
      - name: Pre-clean workspace (best effort)
        run: |
          WORKDIR="${GITHUB_WORKSPACE:-$PWD}"
          chown -R "$(id -u):$(id -g)" "$WORKDIR" 2>/dev/null || true
          rm -rf "$WORKDIR/.pnpm-store" "$WORKDIR/hub-shell/node_modules" "$WORKDIR/hub-shell/dist" || true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: true

      - name: Ensure local cache directories
        run: |
          if mkdir -p "$GOMODCACHE" "$GOCACHE" "$npm_config_cache" 2>/dev/null; then
            echo "Using system cache paths under /var/cache/aprilhub"
          else
            FALLBACK_ROOT="$HOME/.cache/aprilhub"
            mkdir -p "$FALLBACK_ROOT/go/pkg/mod" "$FALLBACK_ROOT/go/build" "$FALLBACK_ROOT/npm"
            {
              echo "GOMODCACHE=$FALLBACK_ROOT/go/pkg/mod"
              echo "GOCACHE=$FALLBACK_ROOT/go/build"
              echo "npm_config_cache=$FALLBACK_ROOT/npm"
            } >> "$GITHUB_ENV"
            echo "System cache not writable; switched to $FALLBACK_ROOT"
          fi

      - name: Init git submodules (DisignApril + april-profile)
        run: ./scripts/ci-init-git-submodules.sh

      - name: Run Hub Shell startup preflight in node:20-alpine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.cache/aprilhub/corepack"
          hub_install='if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi && npm run ds:prepare && npm run build'
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e NODE_AUTH_TOKEN \
            -e npm_config_cache=/tmp/.npm \
            -e COREPACK_HOME=/tmp/.corepack \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/aprilhub/corepack:/tmp/.corepack" \
            -w /workspace/hub-shell \
            node:20-alpine \
            sh -lc "$hub_install"

  aprilhub-smoke:
    name: AprilHub runtime smoke
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 15
    steps:
      - name: Pre-clean workspace (best effort)
        run: |
          WORKDIR="${GITHUB_WORKSPACE:-$PWD}"
          chown -R "$(id -u):$(id -g)" "$WORKDIR" 2>/dev/null || true
          rm -rf "$WORKDIR/.pnpm-store" "$WORKDIR/hub-shell/node_modules" "$WORKDIR/hub-shell/dist" || true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: true

      - name: Ensure local cache directories
        run: |
          if mkdir -p "$GOMODCACHE" "$GOCACHE" "$npm_config_cache" 2>/dev/null; then
            echo "Using system cache paths under /var/cache/aprilhub"
          else
            FALLBACK_ROOT="$HOME/.cache/aprilhub"
            mkdir -p "$FALLBACK_ROOT/go/pkg/mod" "$FALLBACK_ROOT/go/build" "$FALLBACK_ROOT/npm"
            {
              echo "GOMODCACHE=$FALLBACK_ROOT/go/pkg/mod"
              echo "GOCACHE=$FALLBACK_ROOT/go/build"
              echo "npm_config_cache=$FALLBACK_ROOT/npm"
            } >> "$GITHUB_ENV"
            echo "System cache not writable; switched to $FALLBACK_ROOT"
          fi

      - name: Init git submodules (DisignApril + april-profile)
        run: ./scripts/ci-init-git-submodules.sh

      - name: Prepare smoke artifacts directory
        run: mkdir -p artifacts/smoke

      - name: Run AprilHub smoke checks
        env:
          COMPOSE_PROJECT_NAME: aprilhub-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          ./scripts/smoke-aprilhub.sh | tee artifacts/smoke/smoke.log

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprilhub-smoke-artifacts
          path: artifacts/smoke

  aprilhub-k6-baseline:
    name: AprilHub k6 baseline
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 20
    steps:
      - name: Pre-clean workspace (best effort)
        run: |
          WORKDIR="${GITHUB_WORKSPACE:-$PWD}"
          chown -R "$(id -u):$(id -g)" "$WORKDIR" 2>/dev/null || true
          rm -rf "$WORKDIR/.pnpm-store" "$WORKDIR/hub-shell/node_modules" "$WORKDIR/hub-shell/dist" || true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: true

      - name: Ensure local cache directories
        run: |
          if mkdir -p "$GOMODCACHE" "$GOCACHE" "$npm_config_cache" 2>/dev/null; then
            echo "Using system cache paths under /var/cache/aprilhub"
          else
            FALLBACK_ROOT="$HOME/.cache/aprilhub"
            mkdir -p "$FALLBACK_ROOT/go/pkg/mod" "$FALLBACK_ROOT/go/build" "$FALLBACK_ROOT/npm"
            {
              echo "GOMODCACHE=$FALLBACK_ROOT/go/pkg/mod"
              echo "GOCACHE=$FALLBACK_ROOT/go/build"
              echo "npm_config_cache=$FALLBACK_ROOT/npm"
            } >> "$GITHUB_ENV"
            echo "System cache not writable; switched to $FALLBACK_ROOT"
          fi

      - name: Init git submodules (DisignApril + april-profile)
        run: ./scripts/ci-init-git-submodules.sh

      - name: Prepare k6 artifacts directory
        run: mkdir -p artifacts/k6

      - name: Run AprilHub k6 baseline
        env:
          COMPOSE_PROJECT_NAME: aprilhub-k6-${{ github.run_id }}-${{ github.run_attempt }}
          K6_SUMMARY_EXPORT: artifacts/k6/summary.json
        run: |
          set -o pipefail
          ./scripts/run-k6-aprilhub.sh | tee artifacts/k6/k6.log

      - name: Upload k6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprilhub-k6-artifacts
          path: artifacts/k6

  security-scan:
    name: Security dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: hub-bff/go.mod
          cache: true
          cache-dependency-path: hub-bff/go.sum

      - name: Install Go security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Prepare security artifacts directory
        run: mkdir -p artifacts/security

      # ── Go: govulncheck ──
      - name: Run govulncheck on hub-bff
        working-directory: hub-bff
        run: |
          echo "=== govulncheck results ==="
          govulncheck ./... > ../../artifacts/security/govulncheck.log 2>&1 || true
          cat artifacts/security/govulncheck.log

      # ── Go: gosec ──
      - name: Run gosec on hub-bff
        working-directory: hub-bff
        run: |
          echo "=== gosec results ==="
          gosec -severity-critical -severity-high ./... > ../../artifacts/security/gosec.log 2>&1 || true
          cat artifacts/security/gosec.log

      # ── npm: audit ──
      - name: Setup Node.js for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hub-shell/package-lock.json

      - name: Install hub-shell dependencies (minimal)
        working-directory: hub-shell
        run: npm ci --ignore-scripts

      - name: Run npm audit and generate JSON report
        working-directory: hub-shell
        run: |
          echo "=== npm audit results ==="
          npm audit --audit-level=critical || true
          npm audit --json > ../../artifacts/security/npm-audit.json 2>&1 || true

      - name: Upload security scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-artifacts
          path: artifacts/security
          retention-days: 30

      # ── Финальная проверка: фейлим при Critical/High ──
      - name: Fail on Critical/High findings
        run: |
          FAILED=false

          # govulncheck — фейлим при обнаружении vulnerabilities
          if grep -qi "vulnerability" artifacts/security/govulncheck.log 2>/dev/null; then
            echo "🔴 govulncheck found vulnerabilities"
            FAILED=true
          fi

          # gosec — фейлим при Critical или High severity
          if grep -qi "critical\|high" artifacts/security/gosec.log 2>/dev/null; then
            echo "🔴 gosec found Critical or High issues"
            FAILED=true
          fi

          # npm audit — фейлим при Critical
          if grep -qi '"severity":"critical"' artifacts/security/npm-audit.json 2>/dev/null; then
            echo "🔴 npm audit found Critical vulnerabilities"
            FAILED=true
          fi

          if [ "$FAILED" = true ]; then
            echo ""
            echo "============================================"
            echo "  🔴 SECURITY SCAN FAILED"
            echo "  Critical или High findings обнаружены!"
            echo "  См. артефакты security-scan-artifacts."
            echo "============================================"
            exit 1
          else
            echo "✅ Security scan passed — нет Critical/High findings"
          fi
