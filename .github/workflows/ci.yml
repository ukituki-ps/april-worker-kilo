# Обязательный quality gate AprilHub (P0): openapi, hub-bff, hub-shell, smoke, k6.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-compatibility:
    name: OpenAPI compatibility (no breaking changes)
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest

      - name: Check OpenAPI backward compatibility
        run: |
          export PATH="$HOME/go/bin:$PATH"
          scripts/check-openapi-compat.sh

  quality:
    name: Lint OpenAPI and build docs
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: OpenAPI lint
        run: make openapi-lint

      - name: Docusaurus build
        run: make docs-build

  hub-bff:
    name: Hub BFF tests
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: hub-bff/go.mod

      - name: Run Hub BFF tests
        working-directory: hub-bff
        run: go test ./...

  hub-shell:
    name: Hub Shell lint, test and build
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: true

      - name: Init git submodules (public DisignApril; avoid GITHUB_TOKEN 404)
        run: ./scripts/ci-init-git-submodules.sh

      - name: Enable Corepack (pnpm for design-system build)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub-shell/package-lock.json

      - name: Install Hub Shell dependencies
        working-directory: hub-shell
        run: npm ci

      - name: Build design system (DisignApril → @april/ui)
        working-directory: hub-shell
        run: npm run ds:prepare

      - name: Hub Shell lint
        working-directory: hub-shell
        run: npm run lint

      - name: Hub Shell unit tests
        working-directory: hub-shell
        run: npm run test

      - name: Hub Shell build
        working-directory: hub-shell
        run: npm run build

  hub-shell-alpine-runtime:
    name: Hub Shell alpine runtime preflight
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: true

      - name: Init git submodules (public DisignApril; avoid GITHUB_TOKEN 404)
        run: ./scripts/ci-init-git-submodules.sh

      - name: Run Hub Shell startup preflight in node:20-alpine
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e npm_config_cache=/tmp/.npm \
            -e PNPM_HOME=/tmp/.pnpm \
            -v "$PWD:/workspace" \
            -w /workspace/hub-shell \
            node:20-alpine \
            sh -lc "export PATH=/tmp/.local/bin:$PATH && corepack enable --install-directory /tmp/.local/bin && npm ci && npm run ds:prepare && npm run build"

  aprilhub-smoke:
    name: AprilHub runtime smoke
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: true

      - name: Init git submodules (public DisignApril; avoid GITHUB_TOKEN 404)
        run: ./scripts/ci-init-git-submodules.sh

      - name: Prepare smoke artifacts directory
        run: mkdir -p artifacts/smoke

      - name: Run AprilHub smoke checks
        run: ./scripts/smoke-aprilhub.sh | tee artifacts/smoke/smoke.log

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprilhub-smoke-artifacts
          path: artifacts/smoke

  aprilhub-k6-baseline:
    name: AprilHub k6 baseline
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: true

      - name: Init git submodules (public DisignApril; avoid GITHUB_TOKEN 404)
        run: ./scripts/ci-init-git-submodules.sh

      - name: Prepare k6 artifacts directory
        run: mkdir -p artifacts/k6

      - name: Run AprilHub k6 baseline
        env:
          K6_SUMMARY_EXPORT: artifacts/k6/summary.json
        run: ./scripts/run-k6-aprilhub.sh | tee artifacts/k6/k6.log

      - name: Upload k6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprilhub-k6-artifacts
          path: artifacts/k6
